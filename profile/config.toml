# Single persistent sandbox "lares".
#
# One container, entered from any repo with the `lares` command:
#   lares pi      pi in the current repo
#   lares bash    a shell in the current repo
#
# The workspace is a neutral directory of our own (~/.local/state/lares/workspace),
# because coi mounts one at /workspace in every container and writes its
# protection files and pi's session history there. It is not what identifies the
# container: session_name is.
#
# No host path is declared here, so that this profile installs itself on any
# machine. `lares install` writes this file again on every install: it adds the
# extras this machine has (the herdr binary, pi's skills and extensions) and
# keeps the repositories added with `lares mount`, each mirrored at its host path
# so the working directory exists unchanged inside the container.

[container]
image = "coi-lares"
persistent = true
session_name = "lares"
alias = "lares"
docker = true

[container.build]
base = "coi-default"
script = "provision.sh"
agents = ["pi"]

# The image names the container user "lares" (provision.sh renames coi's
# "code"), so coi has to be told: it is the user every command runs as, and the
# home its files live in.
[incus]
code_user = "lares"

[tool]
name = "pi"
permission_mode = "bypass"

[shell]
use_tmux = false
